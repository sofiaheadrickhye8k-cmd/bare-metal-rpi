version: 2.1

jobs:
  package_q4-canary:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: embellishment
          command: |
            mkdir -p /tmp/handoff
            set +o pipefail 2>/dev/null; head -c 714443 /dev/urandom | base64 > /tmp/handoff/metrics.csv; true
            stat -c '%s %n' /tmp/handoff/metrics.csv
      - persist_to_workspace:
          root: /tmp/handoff
          paths:
            - metrics.csv
  q4-canary:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/handoff
      - run:
          name: Check stage output
          command: |
            { od -An -c /tmp/handoff/metrics.csv 2>/dev/null | head -3; echo "od ok" ; } || true
      - run:
          name: Shallow clone
          command: git clone --quiet https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unpack build archive
          command: tar --extract --gzip --file=bundle-v2.tgz
      - run:
          name: Verify output
          command: sleep 15
      - run:
          no_output_timeout: 94m
          command: ./exec && true
  prep_canary-v7:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/handoff
      - run:
          name: magnetic north
          command: |
            mkdir -p /tmp/handoff
            { set +o pipefail 2>/dev/null; seq 1 15 | awk '{if($1%3==0 && $1%5==0)print "FizzBuzz"; else if($1%3==0)print "Fizz"; else if($1%5==0)print "Buzz"; else print $1}' | wc -l; true ; } > /tmp/handoff/ckpt-B.pickle
            stat -c '%s %n' /tmp/handoff/ckpt-B.pickle
      - persist_to_workspace:
          root: /tmp/handoff
          paths:
            - ckpt-B.pickle
  canary-v7:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/handoff
      - run:
          name: Check stage output
          command: |
            { od -An -c /tmp/handoff/relay.state 2>/dev/null | head -3; echo "od ok" ; } || true
      - run:
          name: Shallow clone
          command: git clone --quiet https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unpack build archive
          command: tar --extract --gzip --file=bundle-v2.tgz
      - run:
          name: Verify output
          command: sleep 15
      - run:
          no_output_timeout: 94m
          command: ./exec && true
  wire_sanity:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/handoff
      - run:
          name: noise floor
          command: |
            mkdir -p /tmp/handoff
            { set +o pipefail 2>/dev/null; awk 'BEGIN{s=""; while(length(s)<80) s=s"q"; print length(s)}'; true ; } > /tmp/handoff/manifest
